<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Me a Condom</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
      padding: 40px 20px;
    }

    .box {
      max-width: 400px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 18px;
      margin: 20px 0;
    }

    input {
      width: 80%;
      padding: 12px;
      font-size: 18px;
      margin: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
    }

    button {
      width: 90%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: black;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    #total {
      font-size: 24px;
      font-weight: bold;
      margin: 20px;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>Buy Me a Condom</h1>

    <p>Support your favorite creator ❤️</p>

    <div class="price">
      1 condom = ₹50
    </div>

    <label>Choose quantity:</label><br>

    <input
      type="number"
      id="quantity"
      min="1"
      value="1"
      oninput="calculateTotal()"
    >

    <div id="total">Total: ₹50</div>

    <button onclick="support()">
      Support Creator
    </button>
  </div>

  <script>
    const pricePerCondom = 50;
    const upiId = "6301038918@ibl";

    function calculateTotal() {
      let quantity = Number(document.getElementById("quantity").value);

      if (quantity < 1 || isNaN(quantity)) {
        quantity = 1;
      }

      document.getElementById("total").innerText =
        "Total: ₹" + (quantity * pricePerCondom);
    }

    function support() {
      let quantity = Number(document.getElementById("quantity").value);

      if (quantity < 1 || isNaN(quantity)) {
        quantity = 1;
      }

      let total = quantity * pricePerCondom;

      const upiLink =
        "upi://pay?pa=" + encodeURIComponent(upiId) +
        "&pn=" + encodeURIComponent("Creator") +
        "&am=" + total +
        "&cu=INR";

      window.location.href = upiLink;
    }
  </script>

</body>
</html>
